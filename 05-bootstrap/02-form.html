<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <main class="container my-5">
      <form
        action=""
        method="GET"
        class="mx-auto bg-white p-4 border rounded shadow-sm"
        style="max-width: 600px"
      >
        <h1 class="text-center mb-4 fs-2">Roth IRA Calculator</h1>

        <div class="row mb-3">
          <label for="balance" class="col-md-7 col-form-label"
            >Balance ($)</label
          >
          <div class="col-md-5">
            <input
              type="text"
              id="balance"
              name="balance"
              class="form-control"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label for="annual-contribution" class="col-md-7 col-form-label"
            >Annual contribution ($)</label
          >
          <div class="col-md-5">
            <input
              type="text"
              id="annual-contribution"
              name="annual-contribution"
              class="form-control"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-md-7 col-form-label pt-0"
            >Maximize contribution?</label
          >
          <div class="col-md-5">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="maximize"
                id="yes"
                value="yes"
              />
              <label class="form-check-label" for="yes">Yes</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="maximize"
                id="no"
                value="no"
              />
              <label class="form-check-label" for="no">No</label>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <label for="expected-return" class="col-md-7 col-form-label"
            >Expected rate of return (%)</label
          >
          <div class="col-md-5">
            <input
              type="number"
              id="expected-return"
              name="expected-return"
              class="form-control"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label for="current-age" class="col-md-7 col-form-label"
            >Current age</label
          >
          <div class="col-md-5">
            <input
              type="number"
              id="current-age"
              name="current-age"
              class="form-control"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label for="retirement-age" class="col-md-7 col-form-label"
            >Retirement age</label
          >
          <div class="col-md-5">
            <input
              type="number"
              id="retirement-age"
              name="retirement-age"
              class="form-control"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label for="marginal-tax-rate" class="col-md-7 col-form-label"
            >Marginal tax rate (%)</label
          >
          <div class="col-md-5">
            <input
              type="number"
              id="marginal-tax-rate"
              name="marginal-tax-rate"
              class="form-control"
            />
          </div>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary">Calculate</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>

        <p class="mt-4 mb-0 text-muted" style="font-size: 0.85rem">
          This exercise is a simplified version of the Roth IRA Calculator<br />
          <a
            href="https://www.calculator.net"
            target="_blank"
            class="text-decoration-none"
            >Calculator.net</a
          >.
        </p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
